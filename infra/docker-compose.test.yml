name: football-qa-test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: footballqa_test
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d footballqa_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../football-qa/backend
    environment:
      DATABASE_URL: postgresql+psycopg://football:football@db:5432/footballqa_test
      JWT_SECRET: test-only-jwt-secret-football-qa-2026
      FOOTBALL_API_TOKEN: ""
      MOCK_FOOTBALL_API: "true"
      CORS_ORIGINS: http://localhost:5175
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../../football-qa/frontend
    ports:
      - "127.0.0.1:5175:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_test_data:
