[project]
name = "football-qa-agents"
version = "0.9.0"
description = "Système multi-agents QA local piloté par Telegram"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Configuration minimale : erreurs, imports, bugs évidents.
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Les scripts ajustent sys.path avant les imports applicatifs.
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
